# ============================================================
#  APPLICATION PROPERTIES - PostgreSQL Connection
# ============================================================

spring.application.name=backend

# ============================================================
#  PostgreSQL DATABASE CONNECTION
# ============================================================
#  url format: jdbc:postgresql://HOST:PORT/DATABASE_NAME
#  Default PostgreSQL port = 5432
#  username = postgres (default admin user)
#  password = the password you set during PostgreSQL installation
#
spring.datasource.url=jdbc:postgresql://localhost:5432/saran_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
#  JPA / HIBERNATE SETTINGS
# ============================================================
#  dialect = tells Hibernate to generate PostgreSQL-compatible SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#  "update" = auto-creates/updates tables based on Entity class
spring.jpa.hibernate.ddl-auto=update

#  show-sql = Print SQL queries in console (helpful for learning!)
spring.jpa.show-sql=true

#  format_sql = Make the SQL output readable
spring.jpa.properties.hibernate.format_sql=true
